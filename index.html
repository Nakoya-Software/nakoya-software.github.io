<!doctype html>

<html lang="en" locale="en_us" dir="ltr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nakoya Software</title>
        <link rel="stylesheet" type="text/css" href="https://nakoyasoftware.com/assets/css/global.css">
        <script type="text/javascript" src="https://nakoyasoftware.com/assets/js/header.js"></script>
    </head>
    <body>
        <script type="text/javascript" src="https://nakoyasoftware.com/assets/js/global.js"></script>
        <script>
            (async() => {
                const client = new mainlib.API.Client();

                try {
                    const ping = await client.get('ping'); 
                    if (ping.success) {
                        alert(ping.message);
                    } else {
                        alert('Failed ping');
                    }
                } catch (err) {
                    alert(err);
                }
            })();
        </script>
    </body>
</html>
